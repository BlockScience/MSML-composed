[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-spec-mapping"
version = "0.4.4"
authors = [
  { name="Sean McOwen", email="Sean@Block.Science" },
]
description = "A library for easy mapping of mathematical specifications."
dependencies = [
  "graphviz>=0.20.1",
  "ipython>=7.7.0",
  "pandas>=1.4",
  "jsonschema>=4.21.1",
  "PyGithub==2.5.0",
  "python-dotenv>=1.0.0",
  "pypandoc>=1.15",
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
'math_spec_mapping' = ['*.json']

# --- Tool Configuration ---

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B905",   # zip without strict= (py3.10+)
]

[tool.ruff.lint.isort]
known-first-party = ["math_spec_mapping"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["math_spec_mapping"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true